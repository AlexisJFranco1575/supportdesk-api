name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Audit packages for known vulnerabilities
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee audit.txt
          if grep -q "has the following vulnerable packages" audit.txt; then
            echo "Vulnerable packages found. See the report above."
            exit 1
          fi

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test (unit and integration, uses Docker for SQL Server)
        run: dotnet test --no-build --configuration Release --verbosity normal